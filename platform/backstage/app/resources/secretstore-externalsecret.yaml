# =============================================================================
# Backstage'in ihtiyaç duyduğu 3 secret — HEPSİ Vault → ESO round-trip
# (eso-platform-secrets rolü, `kv/data/platform/backstage/*` — Faz 8 eklentisi)
#
# `backstage-oidc-client-secret`'ın Vault'a YAZILMASI (04-backstage.sh'in
# işi, admin token ile, TEK SEFERLİK) → BURADAKİ ExternalSecret onu GERİ
# ÇEKER. Bu, PostgreSQL composition'ının push+pull desenini (Faz 7) TEKRAR
# KULLANIR — yeni bir mekanizma İCAT EDİLMEDİ.
#
# `backstage-github-token`: platform ekibinin elle Vault'a yazdığı bir
# GitHub PAT/App kimlik bilgisi (scaffolder'ın PR açması için) — 04-
# backstage.sh bunu YAZMAZ, yalnızca OKUR; operatör bunu runbook'taki
# adımla elle Vault'a koyar (bkz. backstage/README.md).
# =============================================================================
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: backstage-vault-backend
  namespace: backstage
spec:
  provider:
    vault:
      server: http://vault-active.vault.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-platform-secrets
          # serviceAccountRef BİLİNÇLİ OLARAK BOŞ — bkz. compositions/
          # postgresql/function.k'deki AYNI gerekçe.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-oidc-client-secret
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef: {name: backstage-vault-backend, kind: SecretStore}
  target:
    name: backstage-oidc-client-secret
    creationPolicy: Owner
  data:
    - secretKey: BACKSTAGE_OIDC_CLIENT_SECRET
      remoteRef: {key: "platform/backstage/oidc", property: clientSecret}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-github-token
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef: {name: backstage-vault-backend, kind: SecretStore}
  target:
    name: backstage-github-token
    creationPolicy: Owner
  data:
    - secretKey: BACKSTAGE_GITHUB_TOKEN
      remoteRef: {key: "platform/backstage/github", property: token}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-db-connection
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef: {name: backstage-vault-backend, kind: SecretStore}
  target:
    name: backstage-db-connection
    creationPolicy: Owner
  data:
    - secretKey: BACKSTAGE_DB_HOST
      remoteRef: {key: "platform/backstage/database", property: host}
    - secretKey: BACKSTAGE_DB_PORT
      remoteRef: {key: "platform/backstage/database", property: port}
    - secretKey: BACKSTAGE_DB_USER
      remoteRef: {key: "platform/backstage/database", property: username}
    - secretKey: BACKSTAGE_DB_PASSWORD
      remoteRef: {key: "platform/backstage/database", property: password}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backstage-session
  namespace: backstage
spec:
  refreshInterval: 1h
  secretStoreRef: {name: backstage-vault-backend, kind: SecretStore}
  target:
    name: backstage-session
    creationPolicy: Owner
  data:
    - secretKey: AUTH_SESSION_SECRET
      remoteRef: {key: platform/backstage/session, property: secret}
