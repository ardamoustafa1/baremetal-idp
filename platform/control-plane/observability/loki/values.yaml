# =============================================================================
# Loki — SingleBinary modu (3 node test topolojisi), Rook-Ceph RGW/S3 backend
#
# S3 kimlik bilgileri BURADA YOK — 05-observability.sh, Faz 1'in Harbor
# deseniyle (rook-ceph namespace'indeki OBC Secret'ını okuyup kopyalama)
# `loki-s3-credentials` Secret'ını üretir; bu dosya `extraEnv` ile o
# Secret'ı AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY ortam değişkenleri
# ÜZERİNDEN referans alır (aşağıya bakın) — Loki'nin S3 istemcisi
# `storage.s3.accessKeyId`/`secretAccessKey` BOŞ bırakıldığında standart
# AWS SDK kimlik bilgisi zincirine (env değişkenleri) düşer.
#
# DÜZELTME (code review #12): bu dosya ÖNCEDEN, YUKARIDAKİ yorumla
# ÇELİŞEN bir şekilde, `secretAccessKey`/`accessKeyId` alanlarını
# DOĞRUDAN ${LOKI_S3_SECRET_KEY}/${LOKI_S3_ACCESS_KEY} olarak İÇERİYORDU
# — yorum "Secret referans alınır" diyordu ama gerçek SIR değeri dosyanın
# KENDİSİNE gömülüyordu (yalnızca script'in envsubst'ü ile, ArgoCD'nin
# `$values` ref source'unun OKUDUĞU ham `.tpl` İÇİNDE). Bu, hem #12'nin
# ("ArgoCD ham .tpl'i devralırsa ne olur" sorusu) hem de bu dosyanın
# render-app-manifests.sh ile GÜVENLE commit edilip edilemeyeceğinin
# (edilemezdi — bir SIR commit edilirdi) kök nedeniydi. Artık gerçekten
# SIR İÇERMİYOR — güvenle render edilip git'e commit edilebilir (bkz.
# render-app-manifests.sh'in `platform/control-plane/observability/`
# girdisi ve `01-loki.yaml`'ın rendered values.yaml'a işaret etmesi).
# =============================================================================

deploymentMode: SingleBinary   # 3 node'da SimpleScalable gereksiz karmaşıklık

loki:
  auth_enabled: false          # Küme-içi, Cilium NetworkPolicy ile korunuyor (Faz 3'ün Vault'una benzer bilinçli sınır)
  commonConfig:
    replication_factor: 1      # SingleBinary'de anlamsız (tek replika) — 9.5'te SimpleScalable'a geçilirse 3 yapılacak

  # DÜZELTME (Faz 12b, GERÇEK bir kind cluster'ında keşfedildi): chart
  # `schemaConfig` BOŞ BIRAKILDIĞINDA (varsayılan `{}`) chart'ın KENDİ
  # `templates/validate.yaml` doğrulaması KESİN olarak reddediyor ("a real
  # Loki install requires a proper schemaConfig") — bu alan da daha önce
  # HİÇ TANIMLANMAMIŞTI (loki/values.yaml.tpl'in canlı hiçbir Loki chart
  # kurulumunda çalıştırılmadığının ikinci bağımsız kanıtı). `tsdb` +
  # `object_store: s3` (yukarıdaki `storage.type: s3` ile TUTARLI) kullanan
  # standart bir tek-şema config eklendi.
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  storage:
    type: s3
    bucketNames:
      chunks: loki-storage
      ruler: loki-storage
      admin: loki-storage
    s3:
      endpoint: rook-ceph-rgw-platform-store.rook-ceph.svc.cluster.local:80
      # NOT (bkz. compositions/postgresql/function.k'deki AYNI teknik borç):
      # RGW object store adı ("platform-store") burada da SABİT — Faz 1'in
      # .env.example varsayılanıyla KENETLİ.
      insecure: true            # RGW henüz TLS'siz (teknik borç, bkz. PLATFORM_CONTEXT)
      s3ForcePathStyle: true    # RGW path-style erişim ister (virtual-hosted DEĞİL)
      # secretAccessKey/accessKeyId BİLİNÇLİ OLARAK BOŞ/TANIMSIZ — aşağıdaki
      # `extraEnv`'in sağladığı AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY
      # ortam değişkenlerine (standart AWS SDK kimlik bilgisi zinciri) düşer.

# `loki-s3-credentials` Secret'ının (05-observability.sh `install_loki()`,
# Rook OBC'den kopyalanır) S3 kimlik bilgilerini container'a ortam
# değişkeni olarak enjekte eder — GERÇEK sır değeri BU DOSYADA değil,
# yalnızca Secret ADI var.
#
# DÜZELTME (code review #2, KRİTİK): bu alan ÖNCEDEN KÖK SEVİYEDE
# (`extraEnv:`) tanımlıydı — önceki komentin "chart'ın genel `extraEnv`
# deseni varsayıldı, CANLI doğrulanmadı" itirafı DOĞRU çıktı: kullanıcının
# GERÇEK `helm template` render'ı, `deploymentMode: SingleBinary`
# kullanıldığında kök seviyedeki `extraEnv`'in HİÇBİR container'a
# UYGULANMADIĞINI (StatefulSet'in `loki` container'ında `env: []`)
# kanıtladı — grafana/loki chart'ı `extraEnv`'i YALNIZCA `singleBinary.
# extraEnv`/`read.extraEnv`/`write.extraEnv`/`backend.extraEnv` gibi HER
# DEPLOYMENT MODUNA ÖZEL alt-alanlardan okur, kök seviyeden DEĞİL. Bu
# turda `helm template loki grafana/loki --version 6.16.0 -f
# <bu-dosya>` ile CANLI doğrulandı: `singleBinary.extraEnv` (aşağıya,
# `singleBinary:` bloğunun İÇİNE taşındı) StatefulSet'in `loki`
# container'ının `env` alanında GERÇEKTEN görünüyor (AWS_ACCESS_KEY_ID/
# AWS_SECRET_ACCESS_KEY, secretKeyRef ile).

# DÜZELTME (Faz 12b, GERÇEK bir kind cluster'ında keşfedildi): chart 6.16.0
# `deploymentMode: SingleBinary` KULLANILDIĞINDA BİLE `read`/`write`/
# `backend` (SimpleScalable modunun bileşenleri) için VARSAYILAN replika
# sayısı 3'TÜR — bu üçü SIFIRLANMADIĞI sürece chart'ın KENDİ
# `templates/validate.yaml` doğrulaması "more than zero replicas configured
# for both the single binary and simple scalable targets" hatasıyla
# KESİN olarak REDDEDİYOR. Bu değerler daha önce HİÇ SIFIRLANMAMIŞTI — bu
# values dosyası hiçbir gerçek Loki chart kurulumunda ÇALIŞTIRILMAMIŞTI.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

singleBinary:
  replicas: 1
  extraEnv:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef: {name: loki-s3-credentials, key: AWS_ACCESS_KEY_ID}
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef: {name: loki-s3-credentials, key: AWS_SECRET_ACCESS_KEY}
  persistence:
    storageClass: ceph-block
    size: 20Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: 500m, memory: 1Gi}

# Loki'nin kendi Grafana datasource ConfigMap'ini ÜRETMESİNİ SAĞLAMAZ —
# observability/values.yaml'daki additionalDataSources zaten statik olarak
# tanımlı (iki ayrı mekanizmayı karıştırmamak için).
monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack   # Prometheus'un serviceMonitorSelector'ıyla eşleşir

gateway:
  enabled: true   # nginx gateway — Grafana'nın datasource URL'i bunu hedefliyor

test:
  enabled: false
