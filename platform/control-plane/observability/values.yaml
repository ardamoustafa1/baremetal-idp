# =============================================================================
# kube-prometheus-stack — Prometheus + Alertmanager + Grafana + exporters
# Faz 9. ADR-0001 L4.
#
# Grafana admin parolası BURADA YOK — 05-observability.sh, .env'den bir
# Secret üretir (`existingSecret`). Alertmanager webhook URL'i de aynı
# şekilde .env'den bir Secret'a yazılır (Slack/Teams webhook'unu Git'e
# YAZMAMAK için).
# =============================================================================

# --- Prometheus ---------------------------------------------------------
prometheus:
  prometheusSpec:
    replicas: 1                     # 3 node test topolojisi; Faz 9.5+ HA (2) değerlendirilir
    retention: 15d
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits:   {cpu: 1000m, memory: 2Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 50Gi}
    # Kyverno/Cilium/CNPG gibi bileşenlerin ürettiği TÜM ServiceMonitor'ları
    # namespace sınırı olmadan seçer — release etiketi zaten platform-genel
    # bir kimlik doğrulama sınırı olarak yeterli (Kyverno guardrail'leri
    # bunun ötesini denetler).
    #
    # DÜZELTME (bu turda, taze bir denetimde bulundu — KRİTİK): yukarıdaki
    # "namespace sınırı olmadan seçer" iddiası YANLIŞTI. Prometheus Operator'ın
    # GERÇEK semantiğinde `*Selector` (etiket filtresi) ile `*NamespaceSelector`
    # (namespace filtresi) İKİ BAĞIMSIZ kapıdır — yalnızca `*Selector: {}`
    # ayarlamak, `*NamespaceSelector` HİÇ BELİRTİLMEDİĞİ (nil) sürece Operator'ı
    # yalnızca Prometheus'un KENDİ namespace'i (`observability`) İÇİNDEKİ
    # ServiceMonitor/PodMonitor/PrometheusRule'ları taramaya DEVAM ETTİRİR.
    # Sonuç: `cert-manager` namespace'indeki `certmanager-expiry-rules.yaml`
    # (sertifika süre-dolum alarmı), `opencost` namespace'indeki OpenCost
    # ServiceMonitor'ı, VE `vault` namespace'indeki `vault-tls-monitor.yaml`
    # (Vault sertifika süre-dolum alarmı) HİÇBİRİ Prometheus tarafından ASLA
    # YÜKLENMİYORDU — kurulum script'leri "başarılı" raporlasa bile bu
    # alarmların/metriklerin HİÇBİRİ GERÇEKTE ÇALIŞMIYORDU.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # cert-manager, Hubble/Cilium gibi kube-prometheus-stack'in KENDİ
    # release'i DIŞINDA etiketlenmiş ServiceMonitor'ları da seçer.
    serviceMonitorSelector: {}
    podMonitorSelector: {}
    ruleSelector: {}
    # YUKARIDAKİ etiket filtrelerinin GERÇEKTEN tüm namespace'lere
    # uygulanabilmesi İÇİN GEREKLİ — bu üç alan OLMADAN yukarıdaki `{}`
    # etiket filtreleri yalnızca `observability` namespace'i İÇİNDE anlamlıdır.
    serviceMonitorNamespaceSelector: {}
    podMonitorNamespaceSelector: {}
    ruleNamespaceSelector: {}
    # Uzak yazma YOK (Faz 9'da Thanos/uzun-vade depolama kapsam dışı).
    additionalScrapeConfigs: []

# --- Alertmanager ---------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests: {cpu: 100m, memory: 128Mi}
      limits:   {cpu: 200m, memory: 256Mi}
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ceph-block
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: {storage: 5Gi}
    # DÜZELTME (bu turda, taze bir denetimde bulundu — ORTA): bu satır ÖNCEDEN
    # YOKTU — yorum "alertmanagerSpec.alertmanagerConfigSecret üzerinden
    # bağlanıyor" diyordu ama böyle bir ALAN bu dosyada HİÇ TANIMLI DEĞİLDİ
    # (dangling belge iddiası). GERÇEK bağlantı, `resources/alertmanager-
    # config-{slack,teams}.yaml.tpl`'in ürettiği Secret'ın adının (`alertmanager-
    # kube-prometheus-stack-alertmanager`) Prometheus Operator'ın Alertmanager
    # CR'si için `configSecret` alanı BOŞ bırakıldığında kullandığı ÖRTÜK
    # varsayılana (`alertmanager-<CR-adı>`, CRD şemasından CANLI doğrulandı:
    # `helm show crds prometheus-community/kube-prometheus-stack --version
    # 65.5.1` içindeki `configSecret` alan açıklaması) TESADÜFEN denk gelmesine
    # dayanıyordu. Artık `configSecret` AÇIKÇA aynı adı REFERANS ALIYOR — Helm
    # release adı (`kube-prometheus-stack`) ileride değişirse bu bağlantı
    # SESSİZCE KOPMAZ, script'in ürettiği Secret adı da GÜNCELLENMELİDİR (ikisi
    # artık AYNI, TEK bir yerde (bu alan) görünür).
    configSecret: alertmanager-kube-prometheus-stack-alertmanager
  # routing config BURADA YOK — 05-observability.sh, .env'deki
  # ALERTMANAGER_WEBHOOK_URL'den yukarıdaki `configSecret`'in referans aldığı
  # Secret'ı üretir (resources/alertmanager-config-{slack,teams}.yaml.tpl,
  # render edilip script'çe uygulanır). values.yaml'da yalnızca resources/
  # depolama + YUKARIDAKİ configSecret referansı.

# --- Grafana ---------------------------------------------------------------
grafana:
  replicas: 1
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: ceph-block
    size: 5Gi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {cpu: 200m, memory: 512Mi}

  # --- Dashboard/folder sidecar — Tenant composition'ının ürettiği
  # ConfigMap'leri (label: grafana_dashboard=1) OTOMATİK yükler (item 2'nin
  # "otomatik Grafana klasörü + dashboard" kabul kriterinin GERÇEK mekanizması).
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # Her ConfigMap'in bu annotation'ı, dashboard'un HANGİ klasöre
      # gideceğini belirler — compositions/tenant/function.k bunu
      # "tenant-<teamName>-<environment>" olarak ayarlıyor.
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: false
      searchNamespace: ALL
    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  # --- Datasource'lar: Prometheus (bundled) + Loki + Tempo (ayrı chart'lar,
  # bu yüzden ConfigMap ile EK datasource olarak tanımlanıyor)
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local:80
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo.observability.svc.cluster.local:3100
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
        serviceMap:
          datasourceUid: prometheus

  ingress:
    enabled: false   # Gateway API + TLS — Faz 3 deseni, ayrı bir HTTPRoute'ta

# --- Node/kube-state metrikleri (varsayılan açık, boyut ayarı 3-node için) --
nodeExporter:
  enabled: true
kubeStateMetrics:
  enabled: true

# --- Bileşen bazlı kapatmalar (bare-metal'de anlamsız/erişilemez) -----------
kubeControllerManager:
  enabled: true   # kubeadm control-plane node'unda metrics endpoint açık olmalı
kubeScheduler:
  enabled: true
kubeEtcd:
  enabled: true
kubeProxy:
  enabled: false  # ADR-0001 Karar 2.2 — kube-proxy KULLANILMIYOR (Cilium replacement)

defaultRules:
  create: true
  rules:
    # Etcd/kube-proxy'ye özgü hazır kural setleri kapatıldı — kube-proxy yok,
    # etcd kuralları kubeadm'in kendi etcd exportuna göre ayrıca doğrulanmalı.
    kubeProxy: false
