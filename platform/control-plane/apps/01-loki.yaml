# =============================================================================
# sync-wave 1 — Loki (log depolama, Rook-Ceph RGW/S3 backend)
#
# !!! OTOMATİK SYNC KASITLI OLARAK KAPALI (syncPolicy.automated YOK) !!!
# Bu Application, ArgoCD'nin bu kurulumu SONRADAN DEVRALMASI (adoption)
# içindir — 05-observability.sh, `helm upgrade --install`'ı manuel
# çalıştırır (namespace/Secret hazırlığı DAHİL); automated sync ilk
# kurulumdan ÖNCE açılırsa ArgoCD ile manuel bootstrap YARIŞA girer.
#
# DÜZELTME (code review #12, KRİTİK): `valueFiles` ÖNCEDEN ham
# `values.yaml.tpl`'e işaret ediyordu — o dosya GERÇEK S3 SIR değerlerini
# (`${LOKI_S3_ACCESS_KEY}`/`${LOKI_S3_SECRET_KEY}`) DOĞRUDAN İÇERİYORDU;
# Helm'in `$values` ref source'u bunu OLDUĞU GİBİ git'ten okur (envsubst
# UYGULAMAZ) — ArgoCD bu Application'ı SONRADAN devralırsa (adoption)
# ÇÖZÜLMEMİŞ boş placeholder'ları uygulardı (Velero'nun Faz 12k'de
# düzeltilen sorunuyla AYNI sınıf, ama burada SIR MATERYALİ olduğu için
# DAHA CİDDİ). values.yaml.tpl artık S3 kimlik bilgilerini `extraEnv` +
# `loki-s3-credentials` Secret referansı ile alıyor (HİÇBİR SIR İÇERMİYOR)
# — bu yüzden Velero İLE AYNI şekilde render edilip commit edilen
# `values.yaml`'a geçirildi (bkz. render-app-manifests.sh).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  labels:
    platform.internal/layer: observability
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: "https://grafana.github.io/helm-charts"
      chart: loki
      targetRevision: "6.16.0"
      helm:
        releaseName: loki
        valueFiles:
          - $values/platform/control-plane/observability/loki/values.yaml
    - repoURL: "https://github.com/ardamoustafa1/baremetal-idp.git"
      targetRevision: "main"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    # automated: KASITLI OLARAK YOK — yukarıdaki uyarıya bakın.
