# =============================================================================
# Vault — HA mod, Raft integrated storage, 3 replika
# ADR-0001 Karar 2.3. Rook-Ceph ceph-block üzerinde PV'ler (Faz 1'in
# StorageClass'ı — teknik borç #1: gerçek ad `ceph-block`, `ceph-block-<tier>` değil).
#
# TLS NOTU (DÜZELTİLDİ — Faz 12g, code review #8): bu dosya BİRİNCİ AŞAMAdır
# — listener burada hâlâ tls_disable=1 ile tanımlı, çünkü Vault'un KENDİ
# sertifikasını KENDİ PKI'sinden (pki-int-dev) imzalatabilmesi için önce
# AYAKTA ve unsealed olması gerekir (self-referential bootstrap — döngüsel
# bağımlılık). İKİNCİ AŞAMA — gerçek TLS'in AÇILDIĞI overlay — artık
# `values-tls.yaml`'da: 03-pki.sh'in `enable_vault_tls()` adımı, pki-int-dev
# hazır olduktan SONRA bu iki dosyayı `-f values.yaml -f values-tls.yaml`
# ile BİRLİKTE uygulayarak listener'ı HTTPS'e geçirir (bkz. docs/runbooks/
# vault-self-tls.md — bu overlay o runbook'un OTOMATİKLEŞTİRİLMİŞ hâlidir).
# Trafik bu ikinci aşamaya kadar yalnızca küme-içi ve Cilium NetworkPolicy
# ile korunur (TLS ile değil).
#
# BU DOSYADA STATİK KİMLİK BİLGİSİ YOK. Vault init/unseal çıktısı (root
# token, unseal key'ler) hiçbir zaman bir values/manifest dosyasına yazılmaz.
# =============================================================================

global:
  enabled: true
  tlsDisable: true    # bkz. yukarıdaki TLS notu

injector:
  enabled: false       # Bu platform Vault Agent Injector KULLANMIYOR — secret
                        # yansıtması ESO ile yapılıyor (ADR-0001 Karar 2.3).
                        # Injector'ı açık bırakmak gereksiz bir mutating
                        # webhook + ek saldırı yüzeyi demektir.

server:
  image:
    repository: "hashicorp/vault"
    tag: "1.18.1"

  # --- Transit auto-unseal (Faz 12e, GERÇEK bir kind cluster'ında canlı
  # doğrulandı) -------------------------------------------------------------
  # Bulut KMS DEĞİL (ADR-0001'in "bulut yok" kararıyla UYUMLU) — ayrı, küçük,
  # self-hosted bir Vault örneğinin (platform/pki/vault-unseal/) Transit
  # secrets engine'i KMS gibi kullanılıyor. `token` alanı BİLİNÇLİ olarak
  # BURADA YOK — ConfigMap'ler hassas veri İÇERMEMELİDİR; token aşağıdaki
  # `extraSecretEnvironmentVars` ile bir Kubernetes Secret'tan `VAULT_TOKEN`
  # ortam değişkeni olarak enjekte edilir (HashiCorp'un transit seal
  # client'ı, `token` HCL alanı BOŞSA otomatik olarak `VAULT_TOKEN` ortam
  # değişkenini kullanır — resmi, desteklenen bir davranış).
  #
  # NEDEN AYRI BİR VAULT (bulut KMS'in YOKLUĞUNDA en yakın karşılığı):
  # `docs/runbooks/vault-unseal.md`'deki Shamir prosedürü YEDEK olarak
  # KORUNUR — bu ikinci Vault'un KENDİSİ nadiren yeniden başlar (yalnızca
  # upgrade/bakım) ve o an ELLE unseal edilir; kaybı yalnızca ANA Vault'un
  # OTOMATİK unseal'ını geçici olarak engeller, PKI/secret verisini
  # ETKİLEMEZ.
  extraSecretEnvironmentVars:
    - envName: VAULT_TOKEN
      secretName: vault-autounseal-token
      secretKey: VAULT_TOKEN

  # 3 node test topolojisi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits:   {cpu: 500m, memory: 1Gi}

  readinessProbe:
    enabled: true
    # Sealed Vault "Ready" DEĞİLDİR — bu KASITLI. İlk kurulumda Service
    # endpoint'leri boş görünür; init/unseal SONRASI dolar (docs/runbooks/
    # vault-unseal.md). standbyok=true: HA standby node'lar da (unsealed
    # olduktan sonra) trafik alabilir listede sayılsın.
    # DÜZELTME (Faz 12b, canlı kind cluster'ında doğrulandı): ÖNCEDEN
    # `sealedcode=204&uninitcode=204` vardı — bu, MÜHÜRLÜ bir pod'un
    # kendini "Ready" ilan etmesine yol açıyordu; yani pod durumu (1/1)
    # GERÇEĞİ YANSITMIYORDU ve hemen üstteki YORUMUN söylediğinin TERSİYDİ.
    # Artık mühürlü/init edilmemiş pod 0/1 (Ready DEĞİL) — izleme/alarm
    # için doğru sinyal.
    # ÖNEMLİ (canlı doğrulandı): `vault` Service'i chart tarafından
    # `publishNotReadyAddresses: true` ile gelir — bu KASITLIDIR, mühürlü
    # Vault'a ERİŞİP unseal edebilmek için gereklidir; dolayısıyla bu
    # Service'in endpoint'leri yine de dolu görünür. Uygulamaların
    # kullandığı `vault-active` Service'i ise `vault-active=true` etiket
    # seçicisiyle çalışır ve hepsi mühürlüyken DOĞRU şekilde BOŞ kalır
    # (compositions'lar zaten `vault-active...` adresini kullanıyor).
    # Raft join da BOZULMAZ: `vault-internal` headless Service'i de
    # not-ready adresleri yayınlar — peer keşfi readiness'tan BAĞIMSIZDIR.
    path: "/v1/sys/health?standbyok=true"

  livenessProbe:
    enabled: true
    # KRİTİK DÜZELTME (Faz 12b — GERÇEK bir kind cluster'ında canlı olarak
    # yakalandı): path ÖNCEDEN `?standbyok=true` idi. Init EDİLMEMİŞ bir
    # Vault bu endpoint'e 501, MÜHÜRLÜ bir Vault 503 döner — yani liveness
    # probe BAŞARISIZ olur ve kubelet pod'u ÖLDÜRÜR. Sonuç: operatör
    # init/unseal yapmaya fırsat bulamadan pod crash-loop'a girer
    # (3 custodian'ın anahtarlarını toplaması dakikalar sürebilecekken
    # pencere yalnızca 60s + failureThreshold*period kadardır).
    # `sealedcode=204&uninitcode=204` bu iki durumu "canlı ama beklemede"
    # olarak işaretler — readinessProbe ZATEN bu ayarı kullanıyordu, yani
    # iki probe birbiriyle TUTARSIZDI. Mühürlü Vault ÖLÜ DEĞİLDİR: insan
    # müdahalesi bekler; liveness bunu öldürmemelidir.
    path: "/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"
    initialDelaySeconds: 60

  dataStorage:
    enabled: true
    size: 20Gi
    storageClass: ceph-block
    accessMode: ReadWriteOnce

  auditStorage:
    # Vault audit log — kim neyi ne zaman Vault'tan istedi. Bir kritik
    # PKI/secret sistemi için audit log İSTEĞE BAĞLI değildir.
    enabled: true
    size: 10Gi
    storageClass: ceph-block
    accessMode: ReadWriteOnce

  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true

        listener "tcp" {
          address         = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_disable     = 1
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        # Vault'un kendi lider seçimini Kubernetes Lease API'siyle
        # (Endpoints/Lease nesnesi) görünür kılar — `vault-active` Service'in
        # doğru pod'a yönlenmesi buna dayanır.
        service_registration "kubernetes" {}

        # Transit auto-unseal (Faz 12e) — bkz. yukarıdaki server.
        # extraSecretEnvironmentVars notu. `token` BİLİNÇLİ olarak burada
        # YOK (VAULT_TOKEN ortam değişkeninden okunur).
        seal "transit" {
          address         = "http://vault-unseal.vault-unseal.svc.cluster.local:8200"
          disable_renewal = "false"
          key_name        = "autounseal"
          mount_path      = "transit/"
        }

  # Ana makineler arası (varsa) anti-affinity — 3 node test topolojisinde
  # her replikayı ayrı node'a zorlar (tek node kaybında quorum korunur: 2/3).
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: vault
              app.kubernetes.io/instance: vault
              component: server
          topologyKey: kubernetes.io/hostname

  # HA Service — yalnızca lider (active) node'a yönlendirir. cert-manager ve
  # 03-pki.sh bu adresi kullanır (yazma işlemleri yalnızca lider'e gider).
  service:
    enabled: true

  # standalone modu KAPALI — HA/raft kullanıyoruz.
  standalone:
    enabled: false

ui:
  enabled: true
  serviceType: ClusterIP    # Erişim: port-forward. Gateway API+TLS Faz 4+ değerlendirilecek.

csi:
  enabled: false             # Vault CSI provider kullanılmıyor — ESO tercih edildi.

serverTelemetry:
  serviceMonitor:
    enabled: false           # Faz 4'te kube-prometheus-stack kurulunca
