# =============================================================================
# XTenant — Tenant self-servis soyutlaması
# ADR-0001 Karar 2.1 (Crossplane, Terraform değil) + Karar 2.4 (KCL).
#
# Claim kind: Tenant (ürün ekiplerinin `tenant-requests` reposunda yazdığı)
# Composite kind: XTenant (Crossplane'in ürettiği, cluster-scoped)
# =============================================================================
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xtenants.platform.internal
  labels:
    platform.internal/layer: compositions
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  group: platform.internal
  names:
    kind: XTenant
    plural: xtenants
  claimNames:
    kind: Tenant
    plural: tenants
  connectionSecretKeys: []
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - teamName
                - oidcGroup
                - costCenter
                - environment
                - networkTier
                - quotaTier
              properties:
                teamName:
                  type: string
                  description: >-
                    Tenant adı (ekip/ürün adı — ortam adı DEĞİL).
                    conventions.md §1 ile birebir aynı kalıp.
                  # conventions.md §1: ^[a-z][a-z0-9-]{1,28}[a-z0-9]$
                  pattern: '^[a-z][a-z0-9-]{1,28}[a-z0-9]$'
                  maxLength: 30
                costCenter:
                  type: string
                  description: Maliyet merkezi kodu (conventions.md §3.1).
                  pattern: '^CC-[0-9]{4}$'
                environment:
                  type: string
                  description: Kapalı küme (conventions.md §2.3).
                  enum: [dev, staging, prod]
                networkTier:
                  type: string
                  description: >-
                    isolated: yalnızca DNS egress'i.
                    open: aynı tenant içi serbest + DNS egress/ingress.
                    custom: default-deny dışında hiçbir kural üretilmez —
                    tenant sonradan kendi CiliumNetworkPolicy'sini ekler.
                  enum: [isolated, open, custom]
                quotaTier:
                  type: string
                  description: >-
                    t-shirt kaynak bütçesi. Değerler compositions/tenant/
                    function.k içinde TEK bir yerde tanımlıdır (conventions §4).
                  enum: [small, medium, large]
                oidcGroup:
                  type: string
                  description: >-
                    Keycloak grup adı (conventions.md §5: tenant-<name>).
                    Namespace'teki admin RoleBinding'in subject'i budur —
                    K8s API server OIDC entegrasyonu ÖN KOŞULDUR (henüz
                    yapılmadı, bkz. PLATFORM_CONTEXT.md teknik borç).
                  pattern: '^tenant-[a-z][a-z0-9-]{1,28}[a-z0-9]$'
              x-kubernetes-validations:
                # ZORUNLU: prod ortamında small tier yasak (conventions §4.2)
                - rule: "!(self.environment == 'prod' && self.quotaTier == 'small')"
                  message: "prod ortamında quotaTier=small kullanılamaz (conventions.md §4.2)."
                # DÜZELTME (Faz 12j, code review #10): `teamName`/`environment`
                # (nsName = "tenant-${teamName}-${environment}" — kaynakların
                # ÜRETİLDİĞİ namespace'in KENDİSİ) ÖNCEDEN değiştirilebilirdi.
                # `10-protect-prod-tenant-deletion.yaml` yalnızca Tenant
                # DELETE'ini kapsıyor — bir tenant claim'inin `environment`'ını
                # "prod"dan "dev"e (veya tersi) GÜNCELLEMEK, aynı Kyverno
                # politikasına HİÇ TAKILMADAN, Crossplane'in eski namespace'i
                # SİLİP yeni bir tane ÜRETMESİNE yol açabilirdi (composition,
                # nsName'i spec'ten TÜRETİR — bkz. compositions/tenant/
                # function.k) — DELETE korumasını TAMAMEN BY-PASS eden bir
                # veri kaybı yolu. `oldSelf` karşılaştırması yalnızca UPDATE'te
                # değerlendirilir (CREATE'te `oldSelf` yoktur, kural
                # ATLANIR) — bu, standart Kubernetes CEL semantiğidir.
                - rule: "self.teamName == oldSelf.teamName"
                  message: "teamName değiştirilemez (immutable) — bu alan tenant'ın namespace adının PARÇASIDIR, değişikliği eski namespace'in silinip yenisinin üretilmesine yol açar. Yeni bir Tenant claim'i açın."
                - rule: "self.environment == oldSelf.environment"
                  message: "environment değiştirilemez (immutable) — AYNI gerekçe: namespace adının PARÇASIDIR, ayrıca prod-tenant-deletion korumasını BY-PASS edebilir. Yeni bir Tenant claim'i açın."
                # DÜZELTME (Faz 12l, code review #3 — KRİTİK, yetkilendirme
                # açığı): `tenant-claim-requester` ClusterRole'ü (policies/
                # rbac/tenant-claim-rbac.yaml) TÜM Tenant claim'leri üzerinde
                # genel `update`/`patch` veriyor (RBAC, TEK bir claim'i
                # "başkasınınki" diye AYIRT EDEMEZ) — `04-restrict-tenant-
                # claim-creation.yaml` de yalnızca CREATE'i kontrol ediyordu.
                # `oidcGroup` İMMUTABLE OLMADAN, talep yetkisi olan HERHANGİ
                # bir kullanıcı BAŞKA bir tenant'ın claim'ini `oidcGroup`'unu
                # KENDİ grubuna çevirecek şekilde güncelleyebilir — composition
                # bunu O TENANT'IN namespace'indeki admin RoleBinding'ine
                # (bkz. function.k'nin RoleBinding'i) YANSITIR, yani saldırgan
                # BAŞKA bir tenant'ın namespace'inde admin olur. `oldSelf`
                # karşılaştırması bunu STRUCTURAL olarak KAPATIR.
                - rule: "self.oidcGroup == oldSelf.oidcGroup"
                  message: "oidcGroup değiştirilemez (immutable) — bu alan tenant'ın namespace'indeki YÖNETİCİ RoleBinding'inin subject'idir; değişikliğine izin vermek başka bir tenant'ın namespace'ine yetkisiz admin erişimi kazandırabilir. Grup değişikliği gerekiyorsa platform-admins ile iletişime geçin (Vault/Keycloak seviyesinde, claim seviyesinde DEĞİL)."
            status:
              type: object
              properties:
                namespaceName:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type: {type: string}
                      status: {type: string}
                      reason: {type: string}
                      message: {type: string}
