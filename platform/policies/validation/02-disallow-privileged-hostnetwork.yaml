# =============================================================================
# (b) privileged / hostNetwork pod yasağı
#
# policies/README.md: Audit modunda başlar; Enforce'a geçiş ayrı PR.
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-hostnetwork
  annotations:
    policies.kyverno.io/title: Disallow Privileged and HostNetwork Pods
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      privileged: true ve hostNetwork: true, konteynerı ana makineyle aynı
      ayrıcalık/ağ alanına koyar; tenant izolasyonunu (ADR-0001 Karar 2.2)
      tamamen atlar. Yalnızca ana makine düzeyinde çalışması GEREKEN platform
      DaemonSet'leri (CNI, MetalLB speaker, Ceph OSD hazırlığı) muaftır.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: no-privileged-containers
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          # Cilium (kube-system) ve Ceph OSD hazırlığı (rook-ceph) ham disk/ağ
          # erişimi için privileged GEREKTİRİR. MetalLB speaker de kube-system
          # dışında (metallb-system) host ağına ihtiyaç duyar.
          - resources:
              namespaces:
                - kube-system
                - rook-ceph
                - metallb-system
      # DÜZELTME (bu turda, taze bir denetimde bulundu — KRİTİK): bu kural
      # ÖNCEDEN YALNIZCA `spec.containers`'ı geziyordu — `spec.initContainers`
      # ve `spec.ephemeralContainers` HİÇ kontrol edilmiyordu, kuralın KENDİ
      # mesajı "İSTİSNASIZ" dese de bu doğru DEĞİLDİ. Bu namespace exclude
      # listesi yalnızca `kube-system`/`rook-ceph`/`metallb-system`'i
      # kapsıyor — `vault`/`cert-manager`/`argocd`/`external-secrets`/
      # `crossplane-system`/`kyverno` gibi platformun DİĞER TÜM sistem
      # namespace'lerinde (bunlar `tenant-*`'ın aksine PSA "restricted"
      # etiketleri TAŞIMIYOR, bkz. `08-require-pss-restricted.yaml`) bir
      # initContainer'a `securityContext.privileged: true` koymak bu kuralı
      # TAMAMEN ATLATIYORDU — tam host-breakout riski. Artık HER ÜÇ container
      # listesi (containers/initContainers/ephemeralContainers) AYRI birer
      # `foreach` girdisiyle kontrol ediliyor.
      validate:
        message: >-
          privileged: true yasaktır. Tenant namespace'lerinde İSTİSNASIZ —
          containers/initContainers/ephemeralContainers'ın HİÇBİRİ privileged
          OLAMAZ.
        foreach:
          - list: "request.object.spec.containers"
            pattern:
              =(securityContext):
                =(privileged): "false"
          - list: "request.object.spec.initContainers || `[]`"
            pattern:
              =(securityContext):
                =(privileged): "false"
          - list: "request.object.spec.ephemeralContainers || `[]`"
            pattern:
              =(securityContext):
                =(privileged): "false"

    - name: no-host-network
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          # CNI ve MetalLB speaker'ın kendisi host ağını kullanmak ZORUNDA.
          - resources:
              namespaces:
                - kube-system
                - metallb-system
      validate:
        message: >-
          hostNetwork: true yasaktır. Tenant namespace'lerinde İSTİSNASIZ.
        pattern:
          spec:
            =(hostNetwork): "false"
