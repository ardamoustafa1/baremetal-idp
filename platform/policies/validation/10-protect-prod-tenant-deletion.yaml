# =============================================================================
# Prod tenant claim'lerinin silinmesi için ayrı bir onay adımı — code review
# #12'nin çözümü.
#
# GERÇEK RİSK: `apps/06-tenant-requests-appset.yaml.tpl`'in
# `syncPolicy.automated.prune: true` olması + `tenant-requests` reposundan
# BİR DOSYANIN silinmesi, ArgoCD'nin bu Tenant claim'ini OTOMATİK olarak
# PRUNE etmesine yol açar — bu da Crossplane'in composed kaynakları (namespace,
# CNPG Cluster, PVC'ler) silme zincirini BAŞLATIR. StorageClass'ların
# `reclaimPolicy: Delete` olması (bilinçli, bkz. o dosyanın yorumu — "Kurtarma
# yolu Velero'dur") ile birleşince: git'te TEK bir dosya silme işlemi, ekstra
# bir onay adımı OLMADAN gerçek disk verisinin kaybına dönüşebiliyordu.
#
# BU POLİTİKA NEDEN YALNIZCA Tenant CLAIM'İNİ (namespace/XTenant'ı DEĞİL)
# HEDEFLİYOR: `protect-tenant-resourcequota.yaml`'daki (Faz 12c) canlı keşfe
# bakın — bir DELETE'i, o kaynağın normal bir GC/cascade ZİNCİRİNİN PARÇASI
# olduğu yerde engellemek, silme işlemini SONSUZA KADAR "Terminating"te
# TAKILI bırakabilir. Namespace/XTenant silme, TAM OLARAK böyle bir cascade
# ZİNCİRİDİR (Crossplane finalizer'ları tarafından tetiklenir) — onu da
# gatelemek aynı sınıf hatayı TEKRARLARDI. Tenant CLAIM'i ise farklıdır:
# hiçbir otomatik GC/cascade onu SİLMEZ — yalnızca bir insan (PR) veya
# ArgoCD'nin prune'u onu siler; bu yüzden burada gatelemek GÜVENLİDİR VE
# TAM OLARAK asıl "ön kapı"yı (git dosya silme → ArgoCD prune) kapsar.
#
# ONAY SÜRECİ: `spec.environment: prod` olan bir Tenant claim'i silinmeden
# ÖNCE, claim'e şu İKİ annotation elle (ayrı bir PR/adımla) eklenmelidir:
#   platform.internal/deletion-approved-by: "<onaylayan kişi>"
#   platform.internal/deletion-approved-reason: "<gerekçe>"
# Bu, `require-pss-restricted-clusterwide.yaml`'daki PolicyException
# gerekçe/onay deseniyle AYNIDIR (Faz 10) — yeni bir desen İCAT EDİLMEDİ.
#
# DÜZELTME (Faz 12j, code review #10): bu politika ÖNCEDEN YALNIZCA Tenant
# claim DELETE'ini kapsıyordu — ama bir prod tenant'ın PostgreSQLInstance
# claim'i (KENDİ Cluster/PVC/backup bucket'ıyla) Tenant claim'ine
# DOKUNULMADAN TEK BAŞINA silinebiliyordu (`06-tenant-requests-appset.
# yaml.tpl`, `postgresql/*.yaml` dosyalarını da AYNI prune:true ile izler)
# — bu da AYNI sınıf, onaysız veri kaybı yoluydu. PostgreSQLInstance'ın
# KENDİ `spec.environment` alanı YOK — prod'luğu `spec.tenantRef`'in
# (`tenant-<takım>-<ortam>`, bkz. compositions/tenant/function.k'nin
# `nsName` türetimi) `-prod` ile bitip bitmediğine bakılarak belirlenir.
# `tenantRef` artık immutable (bkz. postgresql/xrd.yaml) — bu kontrolü
# BYPASS etmenin ikinci yolu (tenantRef'i dev'e çevirip silmek) KAPALI.
#
# DÜZELTME (Faz 12k, code review #11 — YÜKSEK): bu politika ÖNCEDEN
# yalnızca annotation'ların BOŞ OLMADIĞINI kontrol ediyordu — KİMİN bu
# annotation'ları YAZABİLECEĞİNE dair HİÇBİR kısıt YOKTU. Claim'i
# güncelleyebilen (yani `tenant-claim-requester` ClusterRole'üne sahip,
# bkz. policies/rbac/tenant-claim-rbac.yaml) HERHANGİ bir kullanıcı
# kendi adını yazıp "onaylandı" görüntüsü verebilirdi — teknik kontrol
# GERÇEK bir yetkilendirme DOĞRULAMASI yapmıyordu. YENİ 4 kural: bu iki
# annotation'ın DEĞERİ DEĞİŞTİĞİNDE (eklendiğinde/güncellendiğinde),
# isteği yapan `platform-admins` (veya `oidc:platform-admins`) grubunda
# OLMALIDIR — `restrict-tenant-claim-creation.yaml`'daki (Faz 6) AYNI
# grup kontrolü/AYNI çift-biçim deseni yeniden kullanıldı. ArgoCD'nin
# KENDİ SA'sı İSTİSNA (`restrict-tenant-claim-creation.yaml` ile AYNI
# gerekçe: GitOps akışında asıl denetim PR/CODEOWNERS incelemesinde olur,
# ArgoCD yalnızca ONAYLANMIŞ bir git commit'ini uygular).
#
# HÂLÂ DIŞARIDA KALAN BOŞLUK (dürüstçe işaretli): bu kontrol yalnızca
# Vault/Kubernetes SEVİYESİNDE "platform-admins grubunda mısın" sorusunu
# cevaplar — gerçek bir PR/branch-protection incelemesinin GERÇEKTEN
# yapıldığını/GitHub'daki CODEOWNERS kuralının GERÇEKTEN uygulandığını BU
# POLİTİKA DOĞRULAYAMAZ (bu, tenant-requests reposunun GitHub ayarlarına
# aittir, bu depo/görev kapsamı DIŞINDADIR).
#
# DÜZELTME (code review #15, KRİTİK — Faz 12k/code review #11'in kendi
# ÇÖZÜMÜNDE kalan bir açık): "only-admins-set-*" kuralları yalnızca
# `request.operation Equals UPDATE` önkoşuluyla çalışıyordu — CREATE
# HİÇ KAPSANMIYORDU. `restrict-tenant-claim-creation.yaml`, CLAIM
# CREATE'ini yalnızca "yetkili istekçi mi" diye kontrol eder,
# `spec.environment`'ın DEĞERİNİ veya annotation'ları KISITLAMAZ — yani
# `tenant-claim-requester` rolüne sahip (admin OLMAYAN) HERHANGİ bir
# kullanıcı, `spec.environment: prod` OLAN bir Tenant claim'ini,
# `platform.internal/deletion-approved-by`/`-reason` annotation'larını
# BAŞTAN, CREATE isteğinin İÇİNDE sahte bir değerle DOLU olarak
# gönderebilirdi. `environment` immutable OLDUĞU için (bkz. tenant/xrd.yaml
# CEL kuralı) bu sahte onay SONSUZA KADAR `oldObject`'te KALIR — gerçek bir
# admin ASLA dokunmasa bile, ileride bir DELETE isteğinde
# `require-deletion-approved-by-for-prod` kuralı bu SAHTE annotation'ı
# "onaylanmış" sanıp geçit verirdi. YENİ 4 kural (Tenant/PostgreSQLInstance
# × approved-by/approved-reason), CREATE'te BU İKİ annotation'dan HERHANGİ
# BİRİ doluysa VE istekçi platform-admins/ArgoCD DEĞİLSE isteği REDDEDER —
# "onay yalnızca SONRADAN, ayrı bir admin adımıyla eklenebilir" kısıtını
# CREATE zamanına da GENİŞLETİR.
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: protect-prod-tenant-deletion
  annotations:
    policies.kyverno.io/title: Protect prod Tenant/PostgreSQLInstance claims from unapproved deletion
    policies.kyverno.io/category: Multi-Tenancy / Data Protection
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Tenant, PostgreSQLInstance
    policies.kyverno.io/description: >-
      Prod ortamındaki bir Tenant VEYA PostgreSQLInstance claim'i,
      gerekçeli/onaylı annotation'lar olmadan silinemez — ArgoCD'nin
      otomatik prune'u DAHİL.
spec:
  validationFailureAction: Enforce
  background: false
  # DÜZELTME: her onay annotation'ı AYRI bir kural olarak kontrol edilir
  # (deny.conditions.all İÇİNE "any" iç içe koymak yerine) — Kyverno CLI'nin
  # kabul ettiği en basit/en az riskli koşul şekli budur; iki annotation'dan
  # HERHANGİ biri eksikse, o annotation'ın kendi kuralı reddeder (bir
  # policy'de birden fazla kural VARSA, HERHANGİ birinin reddi TÜM isteği
  # reddeder — bu yüzden "ikisi de gerekli" davranışı korunur).
  rules:
    - name: require-deletion-approved-by-for-prod
      match:
        any:
          - resources:
              kinds:
                - Tenant
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: DELETE
      validate:
        message: >-
          Bu, spec.environment=prod olan bir Tenant claim'i — silinmeden
          ÖNCE claim'e "platform.internal/deletion-approved-by" annotation'ı
          AYRI bir PR/adımla eklenmelidir. Bkz. docs/runbooks/
          disaster-recovery.md "Prod tenant silme onay süreci".
        deny:
          conditions:
            all:
              - key: "{{ request.oldObject.spec.environment || '' }}"
                operator: Equals
                value: "prod"
              - key: "{{ request.oldObject.metadata.annotations.\"platform.internal/deletion-approved-by\" || '' }}"
                operator: Equals
                value: ""

    - name: require-deletion-approved-reason-for-prod
      match:
        any:
          - resources:
              kinds:
                - Tenant
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: DELETE
      validate:
        message: >-
          Bu, spec.environment=prod olan bir Tenant claim'i — silinmeden
          ÖNCE claim'e "platform.internal/deletion-approved-reason" annotation'ı
          AYRI bir PR/adımla eklenmelidir. Bkz. docs/runbooks/
          disaster-recovery.md "Prod tenant silme onay süreci".
        deny:
          conditions:
            all:
              - key: "{{ request.oldObject.spec.environment || '' }}"
                operator: Equals
                value: "prod"
              - key: "{{ request.oldObject.metadata.annotations.\"platform.internal/deletion-approved-reason\" || '' }}"
                operator: Equals
                value: ""

    - name: require-deletion-approved-by-for-prod-postgres
      match:
        any:
          - resources:
              kinds:
                - PostgreSQLInstance
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: DELETE
      validate:
        message: >-
          Bu, prod ortamındaki bir tenant'a ait PostgreSQLInstance claim'i
          (tenantRef "-prod" ile bitiyor) — silinmeden ÖNCE claim'e
          "platform.internal/deletion-approved-by" annotation'ı AYRI bir
          PR/adımla eklenmelidir. Bkz. docs/runbooks/disaster-recovery.md
          "Prod tenant silme onay süreci".
        deny:
          conditions:
            all:
              - key: "{{ ends_with(request.oldObject.spec.tenantRef || '', '-prod') }}"
                operator: Equals
                value: true
              - key: "{{ request.oldObject.metadata.annotations.\"platform.internal/deletion-approved-by\" || '' }}"
                operator: Equals
                value: ""

    - name: require-deletion-approved-reason-for-prod-postgres
      match:
        any:
          - resources:
              kinds:
                - PostgreSQLInstance
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: DELETE
      validate:
        message: >-
          Bu, prod ortamındaki bir tenant'a ait PostgreSQLInstance claim'i
          (tenantRef "-prod" ile bitiyor) — silinmeden ÖNCE claim'e
          "platform.internal/deletion-approved-reason" annotation'ı AYRI
          bir PR/adımla eklenmelidir. Bkz. docs/runbooks/disaster-recovery.md
          "Prod tenant silme onay süreci".
        deny:
          conditions:
            all:
              - key: "{{ ends_with(request.oldObject.spec.tenantRef || '', '-prod') }}"
                operator: Equals
                value: true
              - key: "{{ request.oldObject.metadata.annotations.\"platform.internal/deletion-approved-reason\" || '' }}"
                operator: Equals
                value: ""

    # --- Onay annotation'larını YALNIZCA platform-admins yazabilir (code
    # review #11) — Tenant için 2 kural, PostgreSQLInstance için 2 kural.
    - name: only-admins-set-deletion-approved-by-tenant
      match:
        any:
          - resources:
              kinds:
                - Tenant
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: UPDATE
          - key: "{{ request.object.metadata.annotations.\"platform.internal/deletion-approved-by\" || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.metadata.annotations.\"platform.internal/deletion-approved-by\" || '' }}"
      validate:
        message: >-
          "platform.internal/deletion-approved-by" annotation'ını yalnızca
          platform-admins grubundaki kullanıcılar (veya ArgoCD'nin GitOps
          akışı) ekleyebilir/değiştirebilir.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:argocd:') }}"
                operator: Equals
                value: false
              - key: "{{ request.userInfo.groups || `[]` }}"
                operator: AllNotIn
                value:
                  - platform-admins
                  - "oidc:platform-admins"

    - name: only-admins-set-deletion-approved-reason-tenant
      match:
        any:
          - resources:
              kinds:
                - Tenant
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: UPDATE
          - key: "{{ request.object.metadata.annotations.\"platform.internal/deletion-approved-reason\" || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.metadata.annotations.\"platform.internal/deletion-approved-reason\" || '' }}"
      validate:
        message: >-
          "platform.internal/deletion-approved-reason" annotation'ını
          yalnızca platform-admins grubundaki kullanıcılar (veya ArgoCD'nin
          GitOps akışı) ekleyebilir/değiştirebilir.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:argocd:') }}"
                operator: Equals
                value: false
              - key: "{{ request.userInfo.groups || `[]` }}"
                operator: AllNotIn
                value:
                  - platform-admins
                  - "oidc:platform-admins"

    - name: only-admins-set-deletion-approved-by-postgres
      match:
        any:
          - resources:
              kinds:
                - PostgreSQLInstance
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: UPDATE
          - key: "{{ request.object.metadata.annotations.\"platform.internal/deletion-approved-by\" || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.metadata.annotations.\"platform.internal/deletion-approved-by\" || '' }}"
      validate:
        message: >-
          "platform.internal/deletion-approved-by" annotation'ını yalnızca
          platform-admins grubundaki kullanıcılar (veya ArgoCD'nin GitOps
          akışı) ekleyebilir/değiştirebilir.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:argocd:') }}"
                operator: Equals
                value: false
              - key: "{{ request.userInfo.groups || `[]` }}"
                operator: AllNotIn
                value:
                  - platform-admins
                  - "oidc:platform-admins"

    - name: only-admins-set-deletion-approved-reason-postgres
      match:
        any:
          - resources:
              kinds:
                - PostgreSQLInstance
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: UPDATE
          - key: "{{ request.object.metadata.annotations.\"platform.internal/deletion-approved-reason\" || '' }}"
            operator: NotEquals
            value: "{{ request.oldObject.metadata.annotations.\"platform.internal/deletion-approved-reason\" || '' }}"
      validate:
        message: >-
          "platform.internal/deletion-approved-reason" annotation'ını
          yalnızca platform-admins grubundaki kullanıcılar (veya ArgoCD'nin
          GitOps akışı) ekleyebilir/değiştirebilir.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:argocd:') }}"
                operator: Equals
                value: false
              - key: "{{ request.userInfo.groups || `[]` }}"
                operator: AllNotIn
                value:
                  - platform-admins
                  - "oidc:platform-admins"

    # --- DÜZELTME (code review #15): CREATE zamanında SAHTE onay
    # annotation'ları eklenmesini engeller (yukarıdaki "HÂLÂ DIŞARIDA
    # KALAN BOŞLUK" notuna bakın) — UPDATE kurallarıyla AYNI grup
    # kontrolü/AYNI istisna (ArgoCD), yalnızca `request.operation` CREATE.
    - name: only-admins-set-deletion-approved-by-tenant-on-create
      match:
        any:
          - resources:
              kinds:
                - Tenant
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: CREATE
          - key: "{{ request.object.metadata.annotations.\"platform.internal/deletion-approved-by\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: >-
          Yeni bir Tenant claim'i "platform.internal/deletion-approved-by"
          annotation'ıyla OLUŞTURULAMAZ — bu annotation yalnızca
          platform-admins tarafından, SONRADAN, ayrı bir adımla eklenebilir.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:argocd:') }}"
                operator: Equals
                value: false
              - key: "{{ request.userInfo.groups || `[]` }}"
                operator: AllNotIn
                value:
                  - platform-admins
                  - "oidc:platform-admins"

    - name: only-admins-set-deletion-approved-reason-tenant-on-create
      match:
        any:
          - resources:
              kinds:
                - Tenant
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: CREATE
          - key: "{{ request.object.metadata.annotations.\"platform.internal/deletion-approved-reason\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: >-
          Yeni bir Tenant claim'i "platform.internal/deletion-approved-reason"
          annotation'ıyla OLUŞTURULAMAZ — bu annotation yalnızca
          platform-admins tarafından, SONRADAN, ayrı bir adımla eklenebilir.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:argocd:') }}"
                operator: Equals
                value: false
              - key: "{{ request.userInfo.groups || `[]` }}"
                operator: AllNotIn
                value:
                  - platform-admins
                  - "oidc:platform-admins"

    - name: only-admins-set-deletion-approved-by-postgres-on-create
      match:
        any:
          - resources:
              kinds:
                - PostgreSQLInstance
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: CREATE
          - key: "{{ request.object.metadata.annotations.\"platform.internal/deletion-approved-by\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: >-
          Yeni bir PostgreSQLInstance claim'i
          "platform.internal/deletion-approved-by" annotation'ıyla
          OLUŞTURULAMAZ — bu annotation yalnızca platform-admins tarafından,
          SONRADAN, ayrı bir adımla eklenebilir.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:argocd:') }}"
                operator: Equals
                value: false
              - key: "{{ request.userInfo.groups || `[]` }}"
                operator: AllNotIn
                value:
                  - platform-admins
                  - "oidc:platform-admins"

    - name: only-admins-set-deletion-approved-reason-postgres-on-create
      match:
        any:
          - resources:
              kinds:
                - PostgreSQLInstance
      preconditions:
        all:
          - key: "{{ request.operation }}"
            operator: Equals
            value: CREATE
          - key: "{{ request.object.metadata.annotations.\"platform.internal/deletion-approved-reason\" || '' }}"
            operator: NotEquals
            value: ""
      validate:
        message: >-
          Yeni bir PostgreSQLInstance claim'i
          "platform.internal/deletion-approved-reason" annotation'ıyla
          OLUŞTURULAMAZ — bu annotation yalnızca platform-admins tarafından,
          SONRADAN, ayrı bir adımla eklenebilir.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:argocd:') }}"
                operator: Equals
                value: false
              - key: "{{ request.userInfo.groups || `[]` }}"
                operator: AllNotIn
                value:
                  - platform-admins
                  - "oidc:platform-admins"
