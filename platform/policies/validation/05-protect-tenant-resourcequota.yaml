# =============================================================================
# DÜZELTME (Faz 12c, GERÇEK bir kind cluster'ında keşfedildi): bu politika
# ÖNCEDEN `operations` alanını hiç kısıtlamıyordu — bu, Kubernetes'in KENDİ
# namespace garbage collector'ının (tenant namespace silinirken tenant-quota/
# tenant-limits'i temizlemeye ÇALIŞAN) DELETE isteğinin de reddedilmesine
# yol açıyordu ("system:serviceaccount:crossplane-system:" ile BAŞLAMIYOR"
# koşulu GC'nin kendi kimliğini de yakalıyordu). SONUÇ: bir tenant
# namespace'i SİLİNEMEZ HALE geliyordu — `kubectl delete namespace` SONSUZA
# KADAR "Terminating" durumunda TAKILI KALIYORDU (canlı doğrulandı:
# `NamespaceDeletionContentFailure` — bu policy tarafından bloke edildi).
# Politikanın kendi amacı (elle BÜYÜTME/DÜZENLEME'yi engellemek) DELETE'i
# değil yalnızca CREATE/UPDATE'i kapsamalı — Crossplane zaten silinen bir
# nesneyi bir sonraki reconcile'da YENİDEN OLUŞTURUR, bu yüzden DELETE'i
# engellemenin gerçek bir güvenlik FAYDASI da yok, yalnızca namespace
# yaşam döngüsünü KIRIYORDU.
#
# (2) quotaTier bypass koruması
#
# XRD (compositions/tenant/xrd.yaml) `quotaTier` alanını zaten enum
# (small/medium/large) ile kısıtlıyor — bu, claim SEVİYESİNDE bir korumadır.
# Ama bir kullanıcının kotayı aşmasının GERÇEK yolu claim'i değiştirmek
# değil, composition'ın ürettiği `ResourceQuota`/`LimitRange` nesnesini
# DOĞRUDAN elle büyütmektir (`kubectl edit resourcequota tenant-quota -n
# tenant-acme-dev`). Bu politika TAM OLARAK BUNU engeller: `tenant-quota`
# ve `tenant-limits` adlı nesneler yalnızca Crossplane'in kendi
# ServiceAccount'ı (provider-kubernetes, Faz 2) tarafından yazılabilir.
#
# `starts_with` ile prefix eşleşmesi kullanılıyor çünkü provider-kubernetes'in
# ServiceAccount adı kurulumda RASTGELE üretilir (Faz 2/Faz 6), tam adı
# elle yazılamaz.
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: protect-tenant-resourcequota
  annotations:
    policies.kyverno.io/title: Protect Tenant ResourceQuota and LimitRange
    policies.kyverno.io/category: Multi-Tenancy / Resource Management
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: ResourceQuota, LimitRange
    policies.kyverno.io/description: >-
      tenant-quota ve tenant-limits nesneleri yalnızca XTenant composition'ı
      (Crossplane provider-kubernetes) tarafından yazılabilir — quotaTier
      sınırlarının elle atlatılmasını (bypass) engeller.
# DÜZELTME (bu turda, taze bir denetimde bulundu — ORTA-YÜKSEK, kota
# bypass): DELETE'in TAMAMEN dışarıda bırakılması (yukarıdaki (1) notu,
# GERÇEK ve DOĞRU bir düzeltmeydi) YAN ETKİ olarak YENİ bir açık YARATTI:
# `compositions/tenant/function.k`'nin ürettiği tenant-admin Role'ü
# `apiGroups: [""]`, `resources: ["*"]`, `verbs: ["*"]` veriyor — yani
# tenant-admin (SIRADAN, meşru bir OIDC kullanıcısı, namespace GC'siyle
# HİÇ İLGİSİ OLMAYAN) `kubectl delete resourcequota tenant-quota` ile
# KENDİ kotasını DOĞRUDAN silebilir. Crossplane bir sonraki reconcile'da
# nesneyi YENİDEN OLUŞTURUR — ama BU ARADA (dakikalar sürebilir) namespace'te
# HİÇBİR CPU/bellek/pod SINIRI YOKTUR; bu pencerede açılan kota-üstü pod'lar
# kota GERİ GELDİĞİNDE RETROAKTİF olarak tahliye EDİLMEZ. ÇÖZÜM: DELETE'i
# TEKRAR kapsama al ama YALNIZCA namespace'in KENDİSİ ZATEN silinme
# sürecinde DEĞİLKEN (`metadata.deletionTimestamp` BOŞ) reddet — GC'nin
# namespace silme SIRASINDA gönderdiği DELETE (namespace ZATEN Terminating)
# İZİN VERİLİR, ama namespace'i HİÇ etkilemeyen, TEK BAŞINA bir "quota'yı
# sil" isteği REDDEDİLİR. Bu, Faz 12c'nin KENDİ bulduğu "namespace sonsuza
# kadar Terminating'te takılı kalıyordu" regresyonunu TEKRARLAMAZ (o
# regresyon "DELETE'in HERHANGİ bir koşulda reddedilmesi" yüzündendi, bu
# sefer namespace ZATEN terminating İKEN DELETE her zaman İZİN VERİLİYOR).
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: block-manual-quota-edits
      match:
        any:
          - resources:
              kinds:
                - ResourceQuota
              names:
                - "tenant-quota"
              namespaces:
                - "tenant-*"
              operations:
                - CREATE
                - UPDATE
      validate:
        message: >-
          'tenant-quota', yalnızca XTenant composition'ı tarafından yönetilir.
          Kotayı değiştirmek için Tenant claim'inizin quotaTier alanını
          güncelleyin (tenant-requests reposunda bir PR ile) — elle
          düzenleme yasaktır.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:crossplane-system:') }}"
                operator: Equals
                value: false

    - name: block-manual-limitrange-edits
      match:
        any:
          - resources:
              kinds:
                - LimitRange
              names:
                - "tenant-limits"
              namespaces:
                - "tenant-*"
              operations:
                - CREATE
                - UPDATE
      validate:
        message: >-
          'tenant-limits', yalnızca XTenant composition'ı tarafından
          yönetilir. Elle düzenleme yasaktır.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:crossplane-system:') }}"
                operator: Equals
                value: false

    - name: block-manual-quota-delete-unless-namespace-terminating
      match:
        any:
          - resources:
              kinds:
                - ResourceQuota
              names:
                - "tenant-quota"
              namespaces:
                - "tenant-*"
              operations:
                - DELETE
      context:
        - name: nsDeletionTimestamp
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}"
            jmesPath: "metadata.deletionTimestamp || ''"
      validate:
        message: >-
          'tenant-quota' yalnızca namespace'in KENDİSİ silinme sürecindeyken
          (namespace teardown/GC) silinebilir — namespace hâlâ AKTİFKEN
          kotayı tek başına silmek quotaTier sınırlarını GEÇİCİ olarak
          ATLATIR. Kotayı DEĞİŞTİRMEK için Tenant claim'inizin quotaTier
          alanını güncelleyin.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:crossplane-system:') }}"
                operator: Equals
                value: false
              - key: "{{ nsDeletionTimestamp }}"
                operator: Equals
                value: ""

    - name: block-manual-limitrange-delete-unless-namespace-terminating
      match:
        any:
          - resources:
              kinds:
                - LimitRange
              names:
                - "tenant-limits"
              namespaces:
                - "tenant-*"
              operations:
                - DELETE
      context:
        - name: nsDeletionTimestamp
          apiCall:
            urlPath: "/api/v1/namespaces/{{ request.namespace }}"
            jmesPath: "metadata.deletionTimestamp || ''"
      validate:
        message: >-
          'tenant-limits' yalnızca namespace'in KENDİSİ silinme sürecindeyken
          silinebilir — namespace hâlâ AKTİFKEN tek başına silmek yasaktır.
        deny:
          conditions:
            all:
              - key: "{{ starts_with(request.userInfo.username, 'system:serviceaccount:crossplane-system:') }}"
                operator: Equals
                value: false
              - key: "{{ nsDeletionTimestamp }}"
                operator: Equals
                value: ""
