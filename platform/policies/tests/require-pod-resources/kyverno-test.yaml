apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-pod-resources
policies:
  - ../../validation/01-require-pod-resources.yaml
resources:
  - resources.yaml
results:
  - policy: require-pod-resources
    rule: validate-resources
    resources:
      - good-pod
    kind: Pod
    result: pass
  - policy: require-pod-resources
    rule: validate-resources
    resources:
      - bad-pod-no-limits
    kind: Pod
    result: fail
  - policy: require-pod-resources
    rule: validate-resources
    resources:
      - exempt-system-pod
    kind: Pod
    result: skip
