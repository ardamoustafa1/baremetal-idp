apiVersion: v1
kind: Pod
metadata:
  name: good-pod
  namespace: tenant-payments-dev
spec:
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-privileged
  namespace: tenant-payments-dev
spec:
  containers:
    - name: app
      image: nginx:1.27
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-pod-hostnetwork
  namespace: tenant-payments-dev
spec:
  hostNetwork: true
  containers:
    - name: app
      image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: exempt-cilium-agent
  namespace: kube-system
spec:
  hostNetwork: true
  containers:
    - name: cilium-agent
      image: cilium/cilium:v1.16.5
      securityContext:
        privileged: true
