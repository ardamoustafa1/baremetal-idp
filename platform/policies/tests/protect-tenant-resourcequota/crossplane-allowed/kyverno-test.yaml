apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: crossplane-can-manage-quota-and-limitrange
policies:
  - ../../../validation/05-protect-tenant-resourcequota.yaml
resources:
  - resources.yaml
userinfo: userinfo.yaml
results:
  - policy: protect-tenant-resourcequota
    rule: block-manual-quota-edits
    resources: ["tenant-quota"]
    kind: ResourceQuota
    result: pass
  - policy: protect-tenant-resourcequota
    rule: block-manual-limitrange-edits
    resources: ["tenant-limits"]
    kind: LimitRange
    result: pass
