apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: namespace-gc-can-delete-quota-while-namespace-terminating
policies:
  - ../../../validation/05-protect-tenant-resourcequota.yaml
resources:
  - resources.yaml
userinfo: userinfo.yaml
variables: values.yaml
results:
  - policy: protect-tenant-resourcequota
    rule: block-manual-quota-delete-unless-namespace-terminating
    resources: ["tenant-quota"]
    kind: ResourceQuota
    result: pass
  - policy: protect-tenant-resourcequota
    rule: block-manual-limitrange-delete-unless-namespace-terminating
    resources: ["tenant-limits"]
    kind: LimitRange
    result: pass
