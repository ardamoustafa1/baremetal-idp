# =============================================================================
# Kyverno imageVerify — Harbor'dan çekilen HİÇBİR imaj, Cosign ile
# imzalanmamışsa çalıştırılamaz. Faz 10, görev madde 1.
#
# NEDEN Cosign, Notation DEĞİL: platform zaten `cosign` CLI'yi CI'da
# kullanacak (bkz. `.github/workflows/image-supply-chain.yaml`) ve
# Kyverno'nun `verifyImages` kuralı Cosign imzalarını YERLEŞİK olarak
# doğrular — Notation için ayrı bir doğrulayıcı eklenti (trust policy +
# Notation plugin) gerekir. Notation, platformun mevcut zincirine (syft/
# Trivy/Harbor hepsi Cosign ekosistemiyle uyumlu) ekstra bir bağımlılık
# katmadan bırakıldı — bu BİLİNÇLİ bir kapsam daraltmasıdır (teknik borç
# olarak PLATFORM_CONTEXT.md'de kayıtlıdır).
#
# ANAHTAR YÖNETİMİ: Bu policy, public anahtarı bir Kubernetes Secret'tan
# okur (`k8s://kyverno/cosign-image-signing-key`) — GERÇEK ANAHTAR ÇİFTİ
# `05-observability.sh` gibi bir bootstrap script'i DEĞİL, CI/CD pipeline'ının
# imza ATMA adımı (image-supply-chain.yaml) tarafından kullanılan ÖZEL
# anahtarla EŞLEŞMELİDİR — özel anahtar GitHub Actions Secret'ında durur,
# Git'e ASLA yazılmaz (bkz. o workflow'un yorumları).
#
# GERÇEK DOĞRULAMA (bu görevde yapıldı): yerel bir Docker registry (`registry:2`)
# ayağa kaldırıldı, `cosign generate-key-pair` ile GERÇEK bir anahtar çifti
# üretildi, bir imaj imzalandı diğeri imzasız bırakıldı; `kyverno apply` bu
# policy'yi GERÇEK registry'ye karşı çalıştırıp imzalı imajı KABUL, imzasız
# imajı REDDETTİ (bkz. platform/policies/tests/require-signed-images/README.md).
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Cosign-signed images
    policies.kyverno.io/category: Software Supply Chain
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Harbor registry'sinden (harbor.apps.example.internal) çekilen hiçbir imaj,
      platformun Cosign anahtarıyla imzalanmamışsa Pod'a dönüştürülemez.
spec:
  # DÜZELTME (Faz 12g, code review #10): bu alan hiç YOKTU — Kyverno'nun
  # varsayılanı "Audit"tir, yani policy yalnızca UYARI veriyordu, hiçbir
  # imzasız Pod'u FİİLEN engellemiyordu. Yalnızca test fixture'ında
  # (tests/require-signed-images/policy-test.yaml) "Enforce" vardı — gerçek
  # şablona hiç yansıtılmamıştı (bkz. o dosyadaki "kural düzeyinde
  # imageReferences" düzeltmesiyle AYNI sınıf hata: test doğru, gerçek
  # şablon eksik).
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: verify-harbor-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
      # NOT: imageReferences sabit bir örnek domain'le (harbor.
      # apps.platform.internal) yazıldı — 05-observability.sh benzeri bir
      # bootstrap adımı bu policy'yi `envsubst` ile `harbor.apps.example.internal`
      # üzerinden render ETMELİDİR (bkz. tests/README.md "kurulum notu").
      # Kyverno ClusterPolicy'leri Helm/envsubst şablon MEKANİZMASINA sahip
      # değil — bu yüzden policies/README.md'nin "politika yaşam döngüsü"
      # kuralına uyularak, gerçek kurulumdan önce bu satırın ELLE (veya
      # bir `sed`/envsubst adımıyla) güncellenmesi GEREKTİĞİ burada
      # açıkça işaretlendi.
      #
      # DÜZELTME (Faz 12c, GERÇEK bir kind cluster'ında keşfedildi): bu
      # kural düzeyinde (match'in yanında) bir `imageReferences` alanı
      # DAHA vardı — Kyverno v1 ClusterPolicy şemasında `imageReferences`
      # YALNIZCA `verifyImages[]` altında GEÇERLİDİR, kural düzeyinde HİÇ
      # YOK. `kubectl apply` "strict decoding error: unknown field
      # spec.rules[0].imageReferences" ile KESİN olarak reddediyordu — bu
      # policy hiçbir gerçek cluster'a UYGULANMAMIŞTI. Fazladan/geçersiz
      # alan kaldırıldı.
      verifyImages:
        - imageReferences:
            - "harbor.apps.example.internal/*"
          attestors:
            - count: 1
              entries:
                - keys:
                    secret:
                      name: cosign-image-signing-key
                      namespace: kyverno
                    # DÜZELTME (Faz 12c, GERÇEK bir kind cluster'ında GERÇEK
                    # bir admission webhook denemesiyle keşfedildi): CI'nın
                    # kendi imzalama adımı (image-supply-chain.yaml)
                    # `cosign sign --tlog-upload=false` kullanıyor — yani
                    # Rekor'a HİÇ YÜKLEME YAPMIYOR (bilinçli, private/
                    # air-gapped registry senaryosu). Bu alan olmadan
                    # Kyverno VARSAYILAN olarak Rekor tlog doğrulaması
                    # BEKLİYOR — CI'nın İMZALADIĞI HER İMAJ "no matching
                    # signatures: signature not found in transparency log"
                    # ile REDDEDİLİRDİ (canlı doğrulandı: doğru anahtarla
                    # imzalanmış bir imaj bile bu alan olmadan reddedildi,
                    # eklenince kabul edildi). Test fixture'ında
                    # (tests/require-signed-images/policy-test.yaml) bu
                    # düzeltme zaten VARDI ama gerçek şablona hiç
                    # YANSITILMAMIŞTI.
                    rekor:
                      ignoreTlog: true
                    ctlog:
                      ignoreSCT: true
          mutateDigest: true
          required: true

    # DÜZELTME (Faz 12g, code review #10): verifyImages yalnızca
    # `imageReferences: ["harbor.apps.example.internal/*"]` ile EŞLEŞEN imajları
    # doğrular — Kyverno'da bir Pod'un imajı HİÇBİR verifyImages
    # imageReferences deseniyle eşleşmiyorsa, o kural o Pod için SESSİZCE
    # ATLANIR (reddedilmez). Yani bir tenant `docker.io/...` veya başka
    # herhangi bir dış registry'den imaj çekerek Cosign imza doğrulamasını
    # TAMAMEN ATLAYABİLİYORDU — "yalnızca Harbor imzalı imajlar çalışır"
    # garantisi aslında yalnızca "Harbor'dan çekersen imzalı olmak
    # ZORUNDASIN, başka yerden çekersen HİÇBİR KONTROL YOK" anlamına
    # geliyordu. Bu kural, namespace exclude listesi HARİÇ (require-pss-
    # restricted-clusterwide.yaml'daki platform sistemi namespace'leriyle
    # AYNI liste — Cilium/Rook/ArgoCD/vb. kendi upstream imajlarını Harbor
    # DIŞINDAN çeker, bunlar bilinçli olarak kapsam dışı) her Pod'un TÜM
    # container/initContainer imajlarının Harbor'dan geldiğini zorunlu kılar.
    - name: deny-non-harbor-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - kube-node-lease
                - kube-public
                - default
                - cilium
                - metallb-system
                - rook-ceph
                - argocd
                - crossplane-system
                - kyverno
                - external-secrets
                - vault
                - vault-unseal
                - cert-manager
                - harbor
                - keycloak
                - observability
                - opencost
                - backstage
                - pki-test
                - observability-cert-alert-test
                # DÜZELTME (Faz 12i, code review #4): cnpg-system (operatör)
                # ve velero, Faz 12h'de EKLENDİ ama bu liste GÜNCELLENMEDİ —
                # operatörün/Velero'nun kendi upstream imajları (ghcr.io,
                # docker.io) TAMAMEN reddediliyordu. PSS-clusterwide exclude
                # listesiyle (require-pss-restricted-clusterwide.yaml) AYNI
                # bakım hatası — bu ikisi HER platform bileşeni eklendiğinde
                # BİRLİKTE güncellenmelidir.
                - cnpg-system
                - velero
                # DÜZELTME (Faz 12l, code review #4): offsite-sync (Faz 12k'de
                # eklendi, `06-velero.sh:setup_postgres_offsite_sync()`'in
                # CronJob'ları) BU LİSTEDE HİÇ YOKTU — `amazon/aws-cli`
                # imajı Harbor'dan gelmediği için YENİ pod'lar Kyverno
                # tarafından REDDEDİLİYORDU (yerel `kyverno apply` ile
                # CANLI kanıtlandı: `fail: 1 — deny-non-harbor-images`).
                # CronJob "oluşturulmuş" GÖRÜNÜYORDU ama HİÇBİR pod'u
                # ÇALIŞTIRAMIYORDU — sync'in KENDİSİ SESSİZCE hiç
                # gerçekleşmiyordu.
                - offsite-sync
      validate:
        message: >-
          Bu Pod, Harbor registry'si (harbor.apps.example.internal) DIŞINDA bir imaj
          kullanıyor. Yalnızca Harbor'dan çekilen imajlar yukarıdaki
          verify-harbor-image-signature kuralıyla Cosign imza doğrulamasından
          geçer — başka bir registry'den imaj çekmek bu doğrulamayı TAMAMEN
          ATLAR. Tüm imajlar önce Harbor'a push edilip oradan çekilmelidir.
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[?!starts_with(image, 'harbor.apps.example.internal/')] | length(@) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ (request.object.spec.initContainers || `[]`)[?!starts_with(image, 'harbor.apps.example.internal/')] | length(@) }}"
                operator: GreaterThan
                value: 0
