# =============================================================================
# Tenant claim'i AÇMA yetkisi — gerçek K8s RBAC katmanı.
#
# Kyverno (04-restrict-tenant-claim-creation.yaml) bunun BİREBİR AYNISINI
# admission-review seviyesinde tekrar kontrol eder (defense-in-depth) —
# ikisi de aynı grupları (`platform-tenant-requesters`/`platform-admins`)
# referans alır.
#
# NEDEN İKİSİ BİRDEN: RBAC, K8s API server'ın kendi yetkilendirme katmanıdır
# ve normalde YETERLİDİR. Ama:
#   1. RBAC yalnızca "hangi VERB/RESOURCE" bilir, "spec.networkTier=custom
#      mu" gibi KAYNAK İÇERİĞİNE bakamaz — bu yüzden 06 numaralı politika
#      (networkTier=custom) SADECE Kyverno ile mümkün, RBAC ile değil.
#   2. Kyverno, admission zincirinde RBAC'tan SONRA çalışır — RBAC'ı
#      atlayan bir yanlış konfigürasyon (örn. yanlış bir ClusterRoleBinding)
#      olsa bile Kyverno ikinci bir bariyer olarak kalır.
#
# DÜZELTME (Faz 12h, code review #14): bu ClusterRoleBinding ÖNCEDEN
# YALNIZCA öneksiz grup adlarını (`platform-tenant-requesters`,
# `platform-admins`) listeliyordu — ama `docs/runbooks/k8s-api-server-oidc.md`
# API server'ı `--oidc-groups-prefix=oidc:` ile kuruyor, yani gerçek bir OIDC
# token'ından gelen grup üyeliği `oidc:platform-tenant-requesters` biçiminde
# görünür. `compositions/tenant/function.k`'nin RoleBinding'i ZATEN bu öneki
# kullanıyordu (ve Kyverno 04/06 politikaları ZATEN HER İKİ biçimi de
# listeliyordu) — yalnızca BU dosya senkron DEĞİLDİ: `--oidc-groups-prefix`
# kurulu bir cluster'da GERÇEK bir tenant-requester kullanıcısı, tam da bu
# ClusterRoleBinding'in eşleşmemesi YÜZÜNDEN "forbidden" alırdı. Aşağıya
# `oidc:` önekli biçimler EKLENDİ — artık üç yer (bu dosya, tenant
# RoleBinding'i, Kyverno 04/06) AYNI iki biçimi (önekli + öneksiz) kullanıyor.
# =============================================================================
# DÜZELTME (bu turda, taze bir denetimde bulundu — YÜKSEK, cross-tenant
# bilgi ifşası): `tenants` KAYNAĞI ADR-0001 tasarımı gereği TÜM tenant'ların
# claim'lerinin TEK BİR PAYLAŞIMLI namespace'te (`tenant-requests`)
# yaşadığı bir kaynaktır — bu yüzden namespace-özel bir `Role`/`RoleBinding`e
# geçmek TEK BAŞINA bir şey ÇÖZMEZ (aynı paylaşımlı namespace'te KALIR).
# ÖNCEDEN `list`/`watch` de BU ClusterRole'e DAHİLDİ — yani
# `platform-tenant-requesters` grubundaki HERHANGİ bir kullanıcı `kubectl
# get tenants -A` ile TÜM tenant'ların claim'lerini (oidcGroup, costCenter,
# quotaTier, networkTier) TOPLU olarak okuyabiliyordu; bu K8s RBAC'ın
# "yalnızca BENİM claim'imi listele" gibi İÇERİK-bazlı bir kısıtı İFADE
# EDEMEMESİNDEN kaynaklanan GERÇEK bir keşif (reconnaissance) riskiydi.
# `list`/`watch` KALDIRILDI — geriye kalan `get`, yalnızca ADINI BİLEN bir
# kullanıcının TEK BİR claim'i sorgulamasına izin verir (TOPLU tarama
# ARTIK MÜMKÜN DEĞİL); bu, self-servis akışının GERÇEKTEN kullandığı
# `create`/`update`/`patch`/tekil-`get` işlemlerini ETKİLEMEZ (`kubectl get
# tenants -A` gibi bir keşif komutu ARTIK "forbidden" döner). KALAN, BİLİNÇLİ
# kabul edilen sınır: adını TAHMİN EDEN bir kullanıcı hâlâ o TEK claim'i
# `get` edebilir (K8s RBAC'ın statik doğası bunun ÖTESİNE geçemez — GERÇEK
# bir çözüm HER tenant'ın claim'ini KENDİ namespace'ine taşımayı gerektirir,
# bu ADR-0001'in "tek paylaşımlı tenant-requests namespace'i" tasarımını
# DEĞİŞTİRİR, bu turun kapsamı DIŞINDA bırakıldı).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tenant-claim-requester
  labels:
    platform.internal/managed-by: policy-bootstrap
rules:
  - apiGroups: ["platform.internal"]
    resources: ["tenants"]
    verbs: ["create", "get", "update", "patch"]
    # NOT: "delete" BİLİNÇLİ OLARAK YOK — tenant silme, tenant-requests
    # reposunda ayrı bir PR + gerekçe gerektirir (conventions.md, tenant-
    # requests README "Tenant silme" sık sorulan soru). "list"/"watch" de
    # BİLİNÇLİ OLARAK YOK — yukarıdaki DÜZELTME notuna bakın.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tenant-claim-requesters
  labels:
    platform.internal/managed-by: policy-bootstrap
subjects:
  - kind: Group
    name: platform-tenant-requesters
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: platform-admins
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "oidc:platform-tenant-requesters"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "oidc:platform-admins"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: tenant-claim-requester
  apiGroup: rbac.authorization.k8s.io
