# Separate trusted workflow: fork PRs have no write token; never run PR code here.
name: comment-tenant-validation
on:
  workflow_run:
    workflows: [validate-tenant-request]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = run.pull_requests;
            if (!prs.length) return;
            const marker = '<!-- tenant-requests-validation -->';
            const body = `${marker}\nClaim validation: **${run.conclusion}**\n\n[Schema, render ve policy raporu](${run.html_url}) — claim-validation artifact.\nCommit: ${run.head_sha}`;
            for (const pr of prs) {
              const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
              if (current.data.head.sha !== run.head_sha) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr.number});
              const previous = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
              if (previous) await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
              else await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
